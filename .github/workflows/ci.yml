name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet · test -race (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21", "1.22", "1.23"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.mod
            faultlinegin/go.sum
      - name: go vet (core)
        run: go vet ./...
      - name: go test -race (core)
        run: go test -race -count=1 ./...
      - name: go vet + test -race (faultlinegin module)
        working-directory: faultlinegin
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: build example
        run: go build ./examples/...

  lint:
    name: gofmt · staticcheck
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            go.mod
            faultlinegin/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...
          (cd faultlinegin && staticcheck ./...)
      - name: go mod tidy is clean
        run: |
          go mod tidy && (cd faultlinegin && go mod tidy)
          git diff --exit-code -- go.mod faultlinegin/go.mod faultlinegin/go.sum
